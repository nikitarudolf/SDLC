tyle="font-size:14.5px">Правила</text><text x="600" y="348.5" text-anchor="middle" class="lb" style="font-size:14.5px">выполнены?</text><rect x="825.0" y="308.0" width="210" height="54" rx="14" class="sh"/><text x="930" y="331.5" text-anchor="middle" class="lb" style="font-size:14.5px">Показать причину</text><text x="930" y="348.5" text-anchor="middle" class="lb" style="font-size:14.5px">отказа</text><circle cx="930" cy="425" r="12" class="sh"/><circle cx="930" cy="425" r="7" fill="#000"/><rect x="75.0" y="398.0" width="290" height="54" rx="14" class="sh"/><text x="220" y="421.5" text-anchor="middle" class="lb" style="font-size:14.5px">Выбрать ЛР, поставить флажок</text><text x="220" y="438.5" text-anchor="middle" class="lb" style="font-size:14.5px">о неявке, подтвердить</text><rect x="470.0" y="488.0" width="260" height="54" rx="14" class="sh"/><text x="600" y="511.5" text-anchor="middle" class="lb" style="font-size:14.5px">Заблокировать слот</text><text x="600" y="528.5" text-anchor="middle" class="lb" style="font-size:14.5px">(SELECT … FOR UPDATE)</text><polygon points="600,573.0 715.0,615 600,657.0 485.0,615" class="sh"/><text x="600" y="611.5" text-anchor="middle" class="lb" style="font-size:14.5px">Есть свободные</text><text x="600" y="628.5" text-anchor="middle" class="lb" style="font-size:14.5px">места?</text><rect x="470.0" y="698.0" width="260" height="54" rx="14" class="sh"/><text x="600" y="721.5" text-anchor="middle" class="lb" style="font-size:14.5px">Создать запись BOOKED,</text><text x="600" y="738.5" text-anchor="middle" class="lb" style="font-size:14.5px">присвоить позицию</text><rect x="805.0" y="698.0" width="250" height="54" rx="14" class="sh"/><text x="930" y="721.5" text-anchor="middle" class="lb" style="font-size:14.5px">Создать запись WAITLISTED</text><text x="930" y="738.5" text-anchor="middle" class="lb" style="font-size:14.5px">(лист ожидания)</text><rect x="465.0" y="833.0" width="270" height="54" rx="14" class="sh"/><text x="600" y="856.5" text-anchor="middle" class="lb" style="font-size:14.5px">Записать в журнал,</text><text x="600" y="873.5" text-anchor="middle" class="lb" style="font-size:14.5px">поставить письмо в outbox</text><rect x="100.0" y="918.0" width="240" height="54" rx="14" class="sh"/><text x="220" y="941.5" text-anchor="middle" class="lb" style="font-size:14.5px">Увидеть позицию</text><text x="220" y="958.5" text-anchor="middle" class="lb" style="font-size:14.5px">и расчётное время</text><circle cx="220" cy="1030" r="12" class="sh"/><circle cx="220" cy="1030" r="7" fill="#000"/><polyline points="220.0,100.0 220.0,123.0" class="ln" marker-end="url(#ar)"/><polyline points="220.0,177.0 220.0,240.0 470.0,240.0" class="ln" marker-end="url(#ar)"/><polyline points="600.0,267.0 600.0,293.0" class="ln" marker-end="url(#ar)"/><polyline points="715.0,335.0 825.0,335.0" class="ln" marker-end="url(#ar)"/><text x="770" y="328.0" text-anchor="middle" class="lb" style="">нет</text><polyline points="930.0,362.0 930.0,413.0" class="ln" marker-end="url(#ar)"/><polyline points="600.0,377.0 600.0,425.0 365.0,425.0" class="ln" marker-end="url(#ar)"/><text x="612" y="408.0" text-anchor="start" class="lb" style="">да</text><polyline points="220.0,452.0 220.0,515.0 470.0,515.0" class="ln" marker-end="url(#ar)"/><polyline points="600.0,542.0 600.0,573.0" class="ln" marker-end="url(#ar)"/><polyline points="600.0,657.0 600.0,698.0" class="ln" marker-end="url(#ar)"/><text x="612" y="686.0" text-anchor="start" class="lb" style="">да</text><polyline points="715.0,615.0 930.0,615.0 930.0,698.0" class="ln" marker-end="url(#ar)"/><text x="822" y="606.0" text-anchor="middle" class="lb" style="">нет [лист ожидания &lt; 3]</text><polyline points="600.0,752.0 600.0,833.0" class="ln" marker-end="url(#ar)"/><polyline points="930.0,752.0 930.0,860.0 735.0,860.0" class="ln" marker-end="url(#ar)"/><polyline points="465.0,860.0 220.0,860.0 220.0,918.0" class="ln" marker-end="url(#ar)"/><polyline points="220.0,972.0 220.0,101