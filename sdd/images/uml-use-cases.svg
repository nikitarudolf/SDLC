s="1311.0,314.0 1149.4,219.6" class="ln" marker-end="url(#oa)"/><polyline points="1311.0,314.0 1188.0,295.1" class="ln" marker-end="url(#oa)"/><polyline points="1311.0,314.0 1170.7,130.2" class="ln" marker-end="url(#oa)"/><polyline points="1311.0,314.0 809.5,381.6" class="ln" marker-end="url(#oa)"/><polyline points="1311.0,454.0 1178.7,487.5" class="ln" marker-end="url(#oa)"/><polyline points="1311.0,454.0 812.0,405.0" class="ln" marker-end="url(#oa)"/><polyline points="1311.0,764.0 1179.6,731.9" class="ln" marker-end="url(#oa)"/><polyline points="1311.0,764.0 1142.3,646.4" class="ln" marker-end="url(#oa)"/><polyline points="1194.5,614.3 1311.0,619.0" class="ln" marker-end="url(#oa)"/><polyline points="605.0,490.0 467.0,490.0" class="dl" marker-end="url(#oa)"/><text x="536.0" y="465.0" text-anchor="middle" class="lb" style="font-size:14px">«extend»</text><text x="536.0" y="481.0" text-anchor="middle" class="lb" style="font-size:14px">[мест нет]</text><polyline points="799.0,207.3 1001.0,257.7" class="dl" marker-end="url(#oa)"/><text x="880.0" y="187.5" text-anchor="middle" class="lb" style="font-size:14px">«extend»</text><text x="880.0" y="203.5" text-anchor="middle" class="lb" style="font-size:14px">[причина указана]</text><polyline points="815.0,280.0 985.0,280.0" class="dl" marker-end="url(#oa)"/><text x="900.0" y="255.0" text-anchor="middle" class="lb" style="font-size:14px">«extend»</text><text x="900.0" y="271.0" text-anchor="middle" class="lb" style="font-size:14px">[прошло ≥ 5 мин]</text><polyline points="815.0,90.0 1035.0,90.0" class="dl" marker-end="url(#oa)"/><text x="925.0" y="83.0" text-anchor="middle" class="lb" style="font-size:14px">«extend»</text><polyline points="427.0,585.0 605.0,585.0" class="dl" marker-end="url(#oa)"/><text x="516.0" y="578.0" text-anchor="middle" class="lb" style="font-size:14px">«include»</text><polyline points="813.6,591.8 986.4,603.2" class="dl" marker-end="url(#oa)"/><text x="900.0" y="590.5" text-anchor="middle" class="lb" style="font-size:14px">«include»</text><polygon points="560,740 836,740 850,754 850,796 560,796" class="sh"/><polyline points="836,740 836,754 850,754" class="ln"/><text x="570" y="760.0" text-anchor="start" class="sm" style="">UC-02, UC-11 и UC-14 ставят письма</text><text x="570" y="778.0" text-anchor="start" class="sm" style="">в очередь отправки (UC-17)</text></g></svg>