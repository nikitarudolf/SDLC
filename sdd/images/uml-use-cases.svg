</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="oa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#000" stroke-width="1.5"/></marker><marker id="ra" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker></defs><rect width="1450" height="920" fill="#fff"/><rect x="10" y="10" width="1430" height="900" class="sh"/><polygon points="10,10 123.0,10 123.0,26 111.0,38 10,38" class="sh"/><text x="18" y="29" class="nm" style="font-size:15px">uc LabQueue</text><g transform="translate(10,50)"><rect x="130" y="10" width="1110" height="800" class="sh"/><text x="145" y="37.0" text-anchor="start" class="nm" style="">«subject» LabQueue</text><ellipse cx="710" cy="395" rx="105" ry="42" class="sh"/><text x="710" y="391.5" text-anchor="middle" class="lb" style="font-size:15px">UC-01 Войти</text><text x="710" y="408.5" text-anchor="middle" class="lb" style="font-size:15px">в систему</text><ellipse cx="270" cy="105" rx="105" ry="42" class="sh"/><text x="270" y="101.5" text-anchor="middle" class="lb" style="font-size:15px">UC-07 Следить за</text><text x="270" y="118.5" text-anchor="middle" class="lb" style="font-size:15px">позицией в очереди</text><ellipse cx="340" cy="200" rx="105" ry="42" class="sh"/><text x="340" y="196.5" text-anchor="middle" class="lb" style="font-size:15px">UC-02</text><text x="340" y="213.5" text-anchor="middle" class="lb" style="font-size:15px">Зарегистрироваться</text><ellipse cx="362" cy="295" rx="105" ry="42" class="sh"/><text x="362" y="291.5" text-anchor="middle" class="lb" style="font-size:15px">UC-03 Просмотреть</text><text x="362" y="308.5" text-anchor="middle" class="lb" style="font-size:15px">слоты</text><ellipse cx="362" cy="490" rx="105" ry="42" class="sh"/><text x="362" y="486.5" text-anchor="middle" class="lb" style="font-size:15px">UC-04 Записаться</text><text x="362" y="503.5" text-anchor="middle" class="lb" style="font-size:15px">на защиту</text><ellipse cx="322" cy="585" rx="105" ry="42" class="sh"/><text x="322" y="581.5" text-anchor="middle" class="lb" style="font-size:15px">UC-06 Отменить или</text><text x="322" y="598.5" text-anchor="middle" class="lb" style="font-size:15px">перенести запись</text><ellipse cx="710" cy="90" rx="105" ry="42" class="sh"/><text x="710" y="86.5" text-anchor="middle" class="lb" style="font-size:15px">UC-13 Выгрузить</text><text x="710" y="103.5" text-anchor="middle" class="lb" style="font-size:15px">отчёт в Excel</text><ellipse cx="710" cy="185" rx="105" ry="42" class="sh"/><text x="710" y="181.5" text-anchor="middle" class="lb" style="font-size:15px">UC-10 Вызвать</text><text x="710" y="198.5" text-anchor="middle" class="lb" style="font-size:15px">вне очереди</text><ellipse cx="710" cy="280" rx="105" ry="42" class="sh"/><text x="710" y="276.5" text-anchor="middle" class="lb" style="font-size:15px">UC-11 Отметить</text><text x="710" y="293.5" text-anchor="middle" class="lb" style="font-size:15px">неявку</text><ellipse cx="710" cy="490" rx="105" ry="42" class="sh"/><text x="710" y="486.5" text-anchor="middle" class="lb" style="font-size:15px">UC-05 Встать в</text><text x="710" y="503.5" text-anchor="middle" class="lb" style="font-size:15px">лист ожидания</text><ellipse cx="710" cy="585" rx="105" ry="42" class="sh"/><text x="710" y="581.5" text-anchor="middle" class="lb" style="font-size:15px">UC-15 Продвинуть</text><text x="710" y="598.5" text-anchor="middle" class="lb" style="font-size:15px">из листа ожидания</text><ellipse cx="1140" cy="90" rx="105" ry="42" class="sh"/><text x="1140" y="78.0" text-anchor="middle" class="lb" style="font-size:15px">UC-12 Просмотреть</text><text x="1140" y="95.0" text-anchor="middle" class="lb" style="font-size:15px">ведомость и отчёт</text><text x="1140" y="112.0" text-anchor="middle" class="lb" style="font-size:15px">о записи</text><ellipse cx="1090" cy="185" rx="105" ry="42" class="sh"/><text x="1090" y="181.5" text-anchor="middle" class="lb" style="font-size:15px">UC-08 Управлять</text><text x="1090" y="198.5" text-anchor="middle" class="lb" style="font-size:15px">слотами и сериями</text><ellipse cx="1090" cy="280" rx="105" ry="42" class="sh"/><text x="1090" y="276.5" text-anchor="middle" class="lb" style="font-size:15px">UC-09 Вести</text><text x="1090" y="293.5" text-anchor="middle" class="lb" style="font-size:15px">живую очередь</text><ellipse cx="1090" cy="510" rx="105" ry="42" class="sh"/><text x="1090" y="498.0" text-anchor="middle" class="lb" style="font-size:15px">UC-14 Управлять</text><text x="1090" y="515.0" text-anchor="middle" class="lb" style="font-size:15px">преподавателями</text><text x="1090" y="532.0" text-anchor="middle" class="lb" style="font-size:15px">и группами</text><ellipse cx="1090" cy="610" rx="105" ry="42" class="sh"/><text x="1090" y="606.5" text-anchor="middle" class="lb" style="font-size:15px">UC-17 Отправить</text><text x="1090" y="623.5" text-anchor="middle" class="lb" style="font-size:15px">уведомления</text><ellipse cx="1090" cy="710" rx="105" ry="42" class="sh"/><text x="1090" y="706.5" text-anchor="middle" class="lb" style="font-size:15px">UC-16 Заморозить</text><text x="1090" y="723.5" text-anchor="middle" class="lb" style="font-size:15px">лист ожидания</text><circle cx="70" cy="362" r="11" class="sh"/><line x1="70" y1="373" x2="70" y2="406" class="ln"/><line x1="51" y1="384" x2="89" y2="384" class="ln"/><line x1="70" y1="406" x2="56" y2="430" class="ln"/><line x1="70" y1="406" x2="84" y2="430" class="ln"/><text x="70" y="450" text-anchor="middle" class="nm" style="font-size:15px">Студент</text><circle cx="1330" cy="292" r="11" class="sh"/><line x1="1330" y1="303" x2="1330" y2="336" class="ln"/><line x1="1311" y1="314" x2="1349" y2="314" class="ln"/><l