<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="880" viewBox="0 0 1720 880"><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#000;font-size:15px}
.nm{font-size:16px;font-weight:700}.st{font-size:14px}.lb{font-size:14.5px}.sm{font-size:14px}
.red{font-size:14.5px;fill:#c00000;font-weight:600}
.ln{stroke:#000;stroke-width:1.5;fill:none}.dl{stroke:#000;stroke-width:1.5;fill:none;stroke-dasharray:7 5}
.mt{stroke:#fff;stroke-width:5px;paint-order:stroke;stroke-linejoin:round}
.sh{fill:#fff;stroke:#000;stroke-width:1.5}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="oa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#000" stroke-width="1.5"/></marker><marker id="ra" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker></defs><rect width="1720" height="880" fill="#fff"/><rect x="10" y="10" width="1700" height="860" class="sh"/><polygon points="10,10 321.75390625,10 321.75390625,26 309.75390625,38 10,38" class="sh"/><text x="18" y="29" class="nm" style="font-size:15px">stm Жизненный цикл записи (Booking)</text><g transform="translate(10,50)"><rect x="370.0" y="101.0" width="200" height="78" rx="16" class="sh"/><text x="470" y="126.0" text-anchor="middle" class="nm" style="font-size:16px">Waitlisted</text><line x1="370.0" y1="134.0" x2="570.0" y2="134.0" class="ln"/><text x="470" y="152.0" text-anchor="middle" class="sm" style="">в листе ожидания</text><text x="470" y="168.0" text-anchor="middle" class="sm" style="">(FIFO)</text><rect x="370.0" y="391.0" width="200" height="78" rx="16" class="sh"/><text x="470" y="416.0" text-anchor="middle" class="nm" style="font-size:16px">Booked</text><line x1="370.0" y1="424.0" x2="570.0" y2="424.0" class="ln"/><text x="470" y="442.0" text-anchor="middle" class="sm" style="">место закреплено,</text><text x="470" y="458.0" text-anchor="middle" class="sm" style="">позиция и ETA</text><rect x="710.0" y="101.0" width="200" height="78" rx="16" class="sh"/><text x="810" y="126.0" text-anchor="middle" class="nm" style="font-size:16px">Expired</text><line x1="710.0" y1="134.0" x2="910.0" y2="134.0" class="ln"/><text x="810" y="152.0" text-anchor="middle" class="sm" style="">лист не дошёл</text><text x="810" y="168.0" text-anchor="middle" class="sm" style="">до студента</text><rect x="710.0" y="246.0" width="200" height="78" rx="16" class="sh"/><text x="810" y="271.0" text-anchor="middle" class="nm" style="font-size:16px">Cancelled</text><line x1="710.0" y1="279.0" x2="910.0" y2="279.0" class="ln"/><text x="810" y="297.0" text-anchor="middle" class="sm" style="">запись отменена,</text><text x="810" y="313.0" text-anchor="middle" class="sm" style="">место освобождено</text><rect x="710.0" y="391.0" width="200" height="78" rx="16" class="sh"/><text x="810" y="416.0" text-anchor="middle" class="nm" style="font-size:16px">InQueue</text><line x1="710.0" y1="424.0" x2="910.0" y2="424.0" class="ln"/><text x="810" y="442.0" text-anchor="middle" class="sm" style="">слот начат,</text><text x="810" y="458.0" text-anchor="middle" class="sm" style="">ждёт вызова</text><rect x="1050.0" y="391.0" width="200" height="78" rx="16" class="sh"/><text x="1150" y="416.0" text-anchor="middle" class="nm" style="font-size:16px">Defending</text><line x1="1050.0" y1="424.0" x2="1250.0" y2="424.0" class="ln"/><text x="1150" y="442.0" text-anchor="middle" class="sm" style="">вызван,</text><text x="1150" y="458.0" text-anchor="middle" class="sm" style="">защищается</text><rect x="1390.0" y="221.0" width="200" height="78" rx="16" class="sh"/><text x="1490" y="246.0" text-anchor="middle" class="nm" style="font-size:16px">Passed</text><line x1="1390.0" y1="254.0" x2="1590.0" y2="254.0" class="ln"/><text x="1490" y="280.0" text-anchor="middle" class="sm" style="">ЛР защищена</text><rect x="1390.0" y="391.0" width="200" height="78" rx="16" class="sh"/><text x="1490" y="416.0" text-anchor="middle" class="nm" style="font-size:16px">Rework</text><line x1="1390.0" y1="424.0" x2="1590.0" y2="424.0" class="ln"/><text x="1490" y="442.0" text-anchor="middle" class="sm" style="">на доработку,</text><text x="1490" y="458.0" text-anchor="middle" class="sm" style="">нужна новая запись</text><rect x="1390.0" y="561.0" width="200" height="78" rx="16" class="sh"/><text x="1490" y="586.0" text-anchor="middle" class="nm" style="font-size:16px">NoShow</text><line x1="1390.0" y1="594.0" x2="1590.0" y2="594.0" class="ln"/><text x="1490" y="620.0" text-anchor="middle" class="sm" style="">запись аннулирована</text><circle cx="50" cy="285" r="10" fill="#000"/><polygon points="190,230 290,285 190,340 90,285" class="sh"/><text x="190" y="281.5" text-anchor="middle" class="lb" style="">Есть свободные</text><text x="190" y="298.5" text-anchor="middle" class="lb" style="">места?</text><polyline points="60.0,285.0 90.0,285.0" class="ln" marker-end="url(#ar)"/><polyline points="190.0,230.0 190.0,140.0 370.0,140.0" class="ln" marker-end="url(#ar)"/><text x="278" y="131.0" text-anchor="middle" class="lb" style="">[нет]</text><polyline points="190.0,340.0 190.0,430.0 370.0,430.0" class="ln" marker-end="url(#ar)"/><text x="278" y="421.0" text-anchor="middle" class="lb" style="">[да]</text><polyline points="470.0,179.0 470.0,391.0" class="ln" marker-end="url(#ar)"/><text x="458" y="273.0" text-anchor="end" class="lb" style="">SeatFreed [&gt; 30 мин до</text><text x="458" y="290.0" text-anchor="end" class="lb" style="">начала, первый в листе]</text><text x="458" y="307.0" text-anchor="end" class="lb" style="">/ письмо «Вы записаны»</text><polyline points="570.0,140.0 710.0,140.0" class="ln" marker-end="url(#ar)"/><text x="640" y="131.0" text-anchor="middle" class="lb" style="">SlotStarted</text><polyline points="570.0,430.0 710.0,430.0" class="ln" marker-end="url(#ar)"/><text x="640" y="421.0" text-anchor="middle" class="lb" style="">SlotStarted</text><polyline points="540.0,179.0 540.0,265.0 710.0,265.0" class="ln" marker-end="url(#ar)"/><text x="550" y="230.0" text-anchor="start" class="lb" style="">Cancel</text><polyline points="540.0,391.0 540.0,305.0 710.0,305.0" class="ln" marker-end="url(#ar)"/><text x="550" y="343.0" text-anchor="start" class="lb" style="">Cancel [≥ 60 мин]</text><text x="550" y="360.0" text-anchor="start" class="lb" style="">/ продвинуть</text><text x="550" y="377.0" text-anchor="start" class="lb" style="">следующего</text><polyline points="910.0,430.0 1050.0,430.0" class="ln" marker-end="url(#ar)"/><text x="980" y="421.0" text-anchor="middle" class="lb" style="">Called</text><polyline points="1150.0,391.0 1150.0,260.0 1390.0,260.0" class="ln" marker-end="url(#ar)"/><text x="1270" y="251.0" text-anchor="middle" class="lb" style="">Passed</text><polyline points="1250.0,430.0 1390.0,430.0" class="ln" marker-end="url(#ar)"/><text x="1320" y="421.0" text-anchor="middle" class="lb" style="">Rework</text><polyline points="1150.0,469.0 1150.0,600.0 1390.0,600.0" class="ln" marker-end="url(#ar)"/><text x="1160" y="546.0" text-anchor="start" class="lb" style="">NoShow [≥ 5 мин</text><text x="1160" y="563.0" text-anchor="start" class="lb" style="">после вызова]</text><text x="1160" y="580.0" text-anchor="start" class="lb" style="">/ письмо «Запись аннулирована»</text><circle cx="1650" cy="260" r="12" class="sh"/><circle cx="1650" cy="260" r="7" fill="#000"/><polyline points="1590.0,260.0 1638.0,260.0" class="ln"/><circle cx="1650" cy="430" r="12" class="sh"/><circle cx="1650" cy="430" r="7" fill="#000"/><polyline points="1590.0,430.0 1638.0,430.0" class="ln"/><circle cx="1650" cy="600" r="12" class="sh"/><circle cx="1650" cy="600" r="7" fill="#000"/><polyline points="1590.0,600.0 1638.0,600.0" class="ln"/><circle cx="960" cy="285" r="12" class="sh"/><circle cx="960" cy="285" r="7" fill="#000"/><polyline points="910.0,285.0 948.0,285.0" class="ln"/><circle cx="960" cy="140" r="12" class="sh"/><circle cx="960" cy="140" r="7" fill="#000"/><polyline points="910.0,140.0 948.0,140.0" class="ln"/><polygon points="40,700 1646,700 1660,714 1660,790 40,790" class="sh"/><polyline points="1646,700 1646,714 1660,714" class="ln"/><text x="50" y="720.0" text-anchor="start" class="sm" style="">minutesToStart — минут до начала слота. Окно записи закрывается за 60 минут до начала, лист ожидания замораживается за 30 минут (REQ-FUNC-007, REQ-FUNC-010).</text><text x="50" y="738.0" text-anchor="start" class="sm" style="">Rework не закрывает ЛР: студент записывается снова. Неявка (NoShow) возможна только через 5 минут после вызова (REQ-FUNC-020).</text><text x="50" y="756.0" text-anchor="start" class="sm" style="">События SeatFreed, SlotStarted, Called, Passed, Rework, NoShow и Cancel порождают действия пользователей и планировщика.</text></g></svg>