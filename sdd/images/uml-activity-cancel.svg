</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="oa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#000" stroke-width="1.5"/></marker><marker id="ra" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker></defs><rect width="1200" height="1150" fill="#fff"/><rect x="10" y="10" width="1180" height="1130" class="sh"/><polygon points="10,10 398.7421875,10 398.7421875,26 386.7421875,38 10,38" class="sh"/><text x="18" y="29" class="nm" style="font-size:15px">act Отмена записи и продвижение (UC-06, UC-15)</text><g transform="translate(10,50)"><rect x="20" y="10" width="350" height="1070" fill="none" class="ln"/><rect x="20" y="10" width="350" height="36" class="sh"/><text x="195.0" y="33.0" text-anchor="middle" class="nm" style="">Студент</text><rect x="370" y="10" width="530" height="1070" fill="none" class="ln"/><rect x="370" y="10" width="530" height="36" class="sh"/><text x="635.0" y="33.0" text-anchor="middle" class="nm" style="">Система</text><rect x="900" y="10" width="260" height="1070" fill="none" class="ln"/><rect x="900" y="10" width="260" height="36" class="sh"/><text x="1030.0" y="33.0" text-anchor="middle" class="nm" style="">Планировщик</text><circle cx="195" cy="90" r="10" fill="#000"/><rect x="80.0" y="123.0" width="230" height="54" rx="14" class="sh"/><text x="195" y="146.5" text-anchor="middle" class="lb" style="font-size:14.5px">Нажать «Отменить»</text><text x="195" y="163.5" text-anchor="middle" class="lb" style="font-size:14.5px">и подтвердить</text><polygon points="600,203.0 700.0,245 600,287.0 500.0,245" class="sh"/><text x="600" y="241.5" text-anchor="middle" class="lb" style="font-size:14.5px">До начала</text><text x="600" y="258.5" text-anchor="middle" class="lb" style="font-size:14.5px">≥ 60 мин?</text><rect x="740.0" y="212.0" width="150" height="66" rx="14" class="sh"/><text x="815" y="233.0" text-anchor="middle" class="lb" style="font-size:14.5px">Отказать:</text><text x="815" y="250.0" text-anchor="middle" class="lb" style="font-size:14.5px">«Сообщите</text><text x="815" y="267.0" text-anchor="middle" class="lb" style="font-size:14.5px">преподавателю»</text><circle cx="815" cy="345" r="12" class="sh"/><circle cx="815" cy="345" r="7" fill="#000"/><rect x="475.0" y="318.0" width="250" height="54" rx="14" class="sh"/><text x="600" y="341.5" text-anchor="middle" class="lb" style="font-size:14.5px">Заблокировать слот, запись</text><text x="600" y="358.5" text-anchor="middle" class="lb" style="font-size:14.5px">→ CANCELLED</text><rect x="490.0" y="408.0" width="220" height="54" rx="14" class="sh"/><text x="600" y="440.0" text-anchor="middle" class="lb" style="font-size:14.5px">Записать в журнал</text><polygon points="600,493.0 725.0,535 600,577.0 475.0,535" class="sh"/><text x="600" y="531.5" text-anchor="middle" class="lb" style="font-size:14.5px">До начала &gt; 30 мин</text><text x="600" y="548.5" text-anchor="middle" class="lb" style="font-size:14.5px">и лист не пуст?</text><rect x="475.0" y="608.0" width="250" height="54" rx="14" class="sh"/><text x="600" y="631.5" text-anchor="middle" class="lb" style="font-size:14.5px">Перевести первого из листа</text><text x="600" y="648.5" text-anchor="middle" class="lb" style="font-size:14.5px">в BOOKED</text><rect x="490" y="691" width="535" height="8" fill="#000"/><rect x="390.0" y="738.0" width="200" height="54" rx="14" class="sh"/><text x="490" y="761.5" text-anchor="middle" class="lb" style="font-size:14.5px">Пересчитать позиции</text><text x="490" y="778.5" text-anchor="middle" class="lb" style="font-size:14.5px">и расчётное время</text><rect x="920.0" y="738.0" width="210" height="54" rx="14" class="sh"/><text x="1025" y="761.5" text-anchor="middle" class="lb" style="font-size:14.5px">Отправить письмо</text><text x="1025" y="778.5" text-anchor="middle" class="lb" style="font-size:14.5px">«Вы записаны» (SMTP)</text><rect x="490" y="836" width="535" height="8" fill="#000"/><rect x="70.0" y="938.0" width="250" height="54" rx="14" class="sh"/><text x="195" y="961.5" text-anchor="middle" class="lb" style="font-size:14.5px">Получить уведомление,</text><text x="195" y="978.5" text-anchor="middle" class="lb" style="font-size:14.5px">увидеть новый статус</text><circle cx="195" cy="1045" r="12" class="sh"/><circle cx="195" cy="1045" r="7" fill="#000"/><polyline points="195.0,100.0 195.0,123.0" class="ln" marker-end="url(#ar)"/><polyline points="195.0,177.0 195.0,245.0 500.0,245.0" class="ln" marker-end="url(#ar)"/><polyline points="700.0,245.0 740.0,245.0" class="ln" marker-end="url(#ar)"/><text x="720" y="237.0" text-anchor="middle" class="lb" style="">нет</text><polyline points="815.0,278.0 815.0,333.0" class="ln" marker-end="url(#ar)"/><polyline points="600.0,287.0 600.0,318.0" class="ln" marker-end="url(#ar)"/><text x="612" y="311.0" text-anchor="start" class="lb" style="">да</text><polyline points="600.0,372.0 600.0,408.0" class="ln" marker-end="url(#ar)"/><polyline points="600.0,462.0 600.0,493.0" class="ln" marker-end="url(#ar)"/><polyline points="600.0,577.0 600.0,608.0" class="ln" marker-end="url(#ar)"/><text x="612" y="601.0" text-anchor="start" class="lb" style="">да</text><polyline points="600.0,662.0 600.0,691.0" class="ln" marker-end="url(#ar)"/><polyline points="490.0,699.0 490.0,738.0" class="ln" marker-end="url(#ar)"/><polyline points="1025.0,699.0 1025.0,738.0" class="ln" marker-end="url(#ar)"/><polyline points="490.0,792.0 490.0,836.0" class="ln" marker-end="url(#ar)"/><polyline points="1025.0,792.0 1025.0,836.0" class="ln" marker-end="url(#ar)"/><polyline points="600.0,844.0 600.0,900.0 195.0,900.0 195.0,938.0" class="ln" marker-end="url(#ar)"/><polyline points="725.0,535.0 1148.0,535.0 1148.0,965.0 320.0,965.0" class="ln" marker-end="url(#ar)"/><text x="745" y="527.0" text-anchor="middle" class="lb" style="">нет</text><polyline points="195.0,992.0 195.0,1033.0" class="ln" marker-end="url(#ar)"/></g></svg>