<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="840" viewBox="0 0 1580 840"><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;fill:#000;font-size:15px}
.nm{font-size:16px;font-weight:700}.st{font-size:14px}.lb{font-size:14.5px}.sm{font-size:14px}
.red{font-size:14.5px;fill:#c00000;font-weight:600}
.ln{stroke:#000;stroke-width:1.5;fill:none}.dl{stroke:#000;stroke-width:1.5;fill:none;stroke-dasharray:7 5}
.mt{stroke:#fff;stroke-width:5px;paint-order:stroke;stroke-linejoin:round}
.sh{fill:#fff;stroke:#000;stroke-width:1.5}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="oa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0.5,0.5 L9.5,5 L0.5,9.5" fill="none" stroke="#000" stroke-width="1.5"/></marker><marker id="ra" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker></defs><rect width="1580" height="840" fill="#fff"/><rect x="10" y="10" width="1560" height="820" class="sh"/><polygon points="10,10 227.2421875,10 227.2421875,26 215.2421875,38 10,38" class="sh"/><text x="18" y="29" class="nm" style="font-size:15px">stm Состояния слота (Slot)</text><g transform="translate(10,50)"><rect x="30" y="50" width="1500" height="280" rx="22" class="sh"/><text x="55" y="80.0" text-anchor="start" class="nm" style="">Planned</text><text x="150" y="80.0" text-anchor="start" class="sm" style="">слот опубликован и ещё не начался</text><circle cx="80" cy="185" r="10" fill="#000"/><rect x="135.0" y="171.0" width="230" height="78" rx="16" class="sh"/><text x="250" y="196.0" text-anchor="middle" class="nm" style="font-size:16px">Scheduled</text><line x1="135.0" y1="204.0" x2="365.0" y2="204.0" class="ln"/><text x="250" y="222.0" text-anchor="middle" class="sm" style="">создан, запись</text><text x="250" y="238.0" text-anchor="middle" class="sm" style="">ещё не открыта</text><rect x="485.0" y="171.0" width="230" height="78" rx="16" class="sh"/><text x="600" y="196.0" text-anchor="middle" class="nm" style="font-size:16px">Open</text><line x1="485.0" y1="204.0" x2="715.0" y2="204.0" class="ln"/><text x="600" y="230.0" text-anchor="middle" class="sm" style="">запись открыта</text><rect x="825.0" y="171.0" width="250" height="78" rx="16" class="sh"/><text x="950" y="196.0" text-anchor="middle" class="nm" style="font-size:16px">RegistrationClosed</text><line x1="825.0" y1="204.0" x2="1075.0" y2="204.0" class="ln"/><text x="950" y="222.0" text-anchor="middle" class="sm" style="">новых записей нет,</text><text x="950" y="238.0" text-anchor="middle" class="sm" style="">лист продвигается</text><rect x="1195.0" y="171.0" width="230" height="78" rx="16" class="sh"/><text x="1310" y="196.0" text-anchor="middle" class="nm" style="font-size:16px">Frozen</text><line x1="1195.0" y1="204.0" x2="1425.0" y2="204.0" class="ln"/><text x="1310" y="222.0" text-anchor="middle" class="sm" style="">лист ожидания</text><text x="1310" y="238.0" text-anchor="middle" class="sm" style="">заморожен</text><polyline points="90.0,190.0 135.0,190.0" class="ln" marker-end="url(#ar)"/><polyline points="365.0,210.0 485.0,210.0" class="ln" marker-end="url(#ar)"/><text x="425" y="176.5" text-anchor="middle" class="lb" style="">after 7 суток</text><text x="425" y="193.5" text-anchor="middle" class="lb" style="">до начала</text><polyline points="715.0,210.0 825.0,210.0" class="ln" marker-end="url(#ar)"/><text x="770" y="176.5" text-anchor="middle" class="lb" style="">after 1 ч</text><text x="770" y="193.5" text-anchor="middle" class="lb" style="">до начала</text><polyline points="1075.0,210.0 1195.0,210.0" class="ln" marker-end="url(#ar)"/><text x="1135" y="176.5" text-anchor="middle" class="lb" style="">after 30 мин</text><text x="1135" y="193.5" text-anchor="middle" class="lb" style="">до начала</text><rect x="1185.0" y="481.0" width="250" height="78" rx="16" class="sh"/><text x="1310" y="506.0" text-anchor="middle" class="nm" style="font-size:16px">InProgress</text><line x1="1185.0" y1="514.0" x2="1435.0" y2="514.0" class="ln"/><text x="1310" y="532.0" text-anchor="middle" class="sm" style="">идёт защита,</text><text x="1310" y="548.0" text-anchor="middle" class="sm" style="">ведётся живая очередь</text><rect x="1195.0" y="668.0" width="230" height="64" rx="16" class="sh"/><text x="1310" y="693.0" text-anchor="middle" class="nm" style="font-size:16px">Finished</text><line x1="1195.0" y1="701.0" x2="1425.0" y2="701.0" class="ln"/><text x="1310" y="720.0" text-anchor="middle" class="sm" style="">слот завершён</text><rect x="390.0" y="472.0" width="260" height="96" rx="16" class="sh"/><text x="520" y="497.0" text-anchor="middle" class="nm" style="font-size:16px">Cancelled</text><line x1="390.0" y1="505.0" x2="650.0" y2="505.0" class="ln"/><text x="520" y="524.0" text-anchor="middle" class="sm" style="">слот отменён, записи</text><text x="520" y="540.0" text-anchor="middle" class="sm" style="">отменены, письма</text><text x="520" y="556.0" text-anchor="middle" class="sm" style="">отправлены</text><polyline points="1310.0,330.0 1310.0,481.0" class="ln" marker-end="url(#ar)"/><text x="1322" y="406.5" text-anchor="start" class="lb" style="">start [не раньше чем</text><text x="1322" y="423.5" text-anchor="start" class="lb" style="">за 15 мин до начала]</text><polyline points="1310.0,559.0 1310.0,668.0" class="ln" marker-end="url(#ar)"/><text x="1322" y="625.0" text-anchor="start" class="lb" style="">finish</text><polyline points="520.0,330.0 520.0,472.0" class="ln" marker-end="url(#ar)"/><text x="532" y="415.0" text-anchor="start" class="lb" style="">cancel(reason)</text><circle cx="1310" cy="760" r="12" class="sh"/><circle cx="1310" cy="760" r="7" fill="#000"/><polyline points="1310.0,732.0 1310.0,748.0" class="ln"/><circle cx="520" cy="620" r="12" class="sh"/><circle cx="520" cy="620" r="7" fill="#000"/><polyline points="520.0,568.0 520.0,608.0" class="ln"/><polygon points="40,665 906,665 920,679 920,751 40,751" class="sh"/><polyline points="906,665 906,679 920,679" class="ln"/><text x="50" y="685.0" text-anchor="start" class="sm" style="">Переходы внутри Planned выполняет планировщик по времени (UC-16);</text><text x="50" y="703.0" text-anchor="start" class="sm" style="">отмена возможна из любого состояния Planned, поэтому показана один раз от составного состояния.</text><text x="50" y="721.0" text-anchor="start" class="sm" style="">В состоянии Frozen продвижение листа ожидания не выполняется (UC-15, поток A2).</text></g></svg>