spring:
  application:
    name: labqueue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labqueue}
    username: ${DB_USER:labqueue}
    password: ${DB_PASSWORD:labqueue}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration,classpath:db/postgres
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  messages:
    encoding: UTF-8

server:
  error:
    include-message: always
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

labqueue:
  zone: Europe/Minsk
  base-url: ${BASE_URL:http://localhost:8080}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
