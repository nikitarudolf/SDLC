<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Регистрация')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="narrow">
    <div class="card">
        <h1>Регистрация студента</h1>
        <form th:action="@{/register}" th:object="${form}" method="post">
            <div class="alert bad" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}"></div>
            <label for="fullName">ФИО</label>
            <input type="text" id="fullName" th:field="*{fullName}" placeholder="Иванов Иван Иванович">
            <div class="field-error" th:errors="*{fullName}"></div>

            <label for="groupId">Группа</label>
            <select id="groupId" th:field="*{groupId}">
                <option value="">— выберите —</option>
                <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.number}">450501</option>
            </select>
            <div class="field-error" th:errors="*{groupId}"></div>

            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}">
            <div class="field-error" th:errors="*{email}"></div>

            <label for="password">Пароль</label>
            <input type="password" id="password" th:field="*{password}">
            <div class="muted">Не короче 8 символов, буквы и цифры</div>
            <div class="field-error" th:errors="*{password}"></div>

            <button class="btn" type="submit">Зарегистрироваться</button>
        </form>
        <p class="muted">Уже есть учётная запись? <a th:href="@{/login}">Войти</a></p>
    </div>
</main>
</body>
</html>
